name: Normalizar comparePrice (one-shot)

# SESIÓN 87: iguala comparePrice = price en productos sin descuento efectivo,
# para que toda la tienda muestre un único precio (lista) cuando no hay promo.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    env:
      TURSO_URL: ${{ secrets.TURSO_URL }}
      TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Normalizar comparePrice
        run: node scripts/normalize-compareprice.mjs
