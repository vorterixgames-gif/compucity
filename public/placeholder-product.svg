<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#f0fdf4"/>
  <rect x="20" y="20" width="360" height="360" rx="16" fill="#ffffff" stroke="#d1fae5" stroke-width="2"/>
  <!-- Icon: camera/image outline -->
  <g transform="translate(130, 110)">
    <!-- Camera body -->
    <rect x="10" y="40" width="120" height="90" rx="12" fill="#e8f5e9" stroke="#86efac" stroke-width="2.5"/>
    <!-- Camera top bump -->
    <path d="M 50 40 L 55 25 L 85 25 L 90 40" fill="#e8f5e9" stroke="#86efac" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Lens circle -->
    <circle cx="70" cy="85" r="22" fill="#ffffff" stroke="#22c55e" stroke-width="2.5"/>
    <circle cx="70" cy="85" r="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <!-- Mountain/landscape inside lens -->
    <path d="M 62 92 L 70 78 L 78 92 Z" fill="#86efac" opacity="0.6"/>
    <!-- Flash dot -->
    <circle cx="105" cy="55" r="4" fill="#86efac"/>
  </g>
  <!-- Text -->
  <text x="200" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#16a34a">Imagen no disponible</text>
  <text x="200" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#86efac">Compucity</text>
</svg>
